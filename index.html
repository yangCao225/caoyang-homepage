<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>曹阳 - 个人主页</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
      background: linear-gradient(135deg, #0c0c1d 0%, #1a1a3e 50%, #0d0d2b 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #e0e0e0;
    }

    .container {
      text-align: center;
      padding: 60px 40px;
      max-width: 500px;
      width: 90%;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    }

    .avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 28px;
      font-size: 40px;
      font-weight: 700;
      color: #fff;
      box-shadow: 0 8px 32px rgba(102, 126, 234, 0.3);
    }

    h1 {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #a78bfa 0%, #60a5fa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      font-size: 14px;
      color: #8888aa;
      margin-bottom: 40px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .info-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      padding: 20px 24px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 16px;
      transition: all 0.3s ease;
    }

    .info-card:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.12);
      transform: translateY(-2px);
    }

    .info-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .icon-email {
      background: rgba(99, 102, 241, 0.15);
      color: #818cf8;
    }

    .icon-name {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
    }

    .info-content {
      text-align: left;
    }

    .info-label {
      font-size: 11px;
      color: #666688;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 4px;
    }

    .info-value {
      font-size: 16px;
      font-weight: 500;
      color: #d0d0e0;
      word-break: break-all;
    }

    .info-value a {
      color: #818cf8;
      text-decoration: none;
      transition: color 0.2s;
    }

    .info-value a:hover {
      color: #a5b4fc;
    }

    .footer {
      margin-top: 32px;
      font-size: 12px;
      color: #555577;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="avatar">曹</div>
    <h1>曹阳</h1>
    <p class="subtitle">Personal Homepage</p>

    <div class="info-card">
      <div class="info-icon icon-name">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
      </div>
      <div class="info-content">
        <div class="info-label">姓名</div>
        <div class="info-value">曹阳</div>
      </div>
    </div>

    <div class="info-card">
      <div class="info-icon icon-email">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="4" width="20" height="16" rx="2"/>
          <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
        </svg>
      </div>
      <div class="info-content">
        <div class="info-label">邮箱</div>
        <div class="info-value">
          <a href="https://mail.163.com">17663231569@163.com</a>
        </div>
      </div>
    </div>

    <div class="footer">湘潭大学 · 环境工程专业</div>
  </div>
</body>
</html>
